name: Sync upstream musl-libc

on:
  schedule:
    # 每天 UTC 0:00 运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 git 历史，用于比较

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://git.musl-libc.org/git/musl
          git fetch upstream
          git fetch upstream --tags --force

      - name: Check for new upstream commits
        id: check
        run: |
          LOCAL_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse upstream/master)
          echo "Local HEAD:  $LOCAL_SHA"
          echo "Upstream:    $UPSTREAM_SHA"
          if [ "$LOCAL_SHA" = "$UPSTREAM_SHA" ]; then
            echo "No new upstream commits. Skipping push."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update to upstream master
        if: steps.check.outputs.has_updates == 'true'
        run: |
          # 快进本地 master 到 upstream/master
          git push . upstream/master:master

      - name: Push to GitHub
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git push origin master

      - name: Sync tags to GitHub
        run: |
          git push origin --tags --force
