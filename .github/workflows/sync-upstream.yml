name: Sync upstream musl-libc

on:
  schedule:
    # 每天 UTC 0:00 运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 git 历史，用于比较

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://git.musl-libc.org/git/musl
          git fetch upstream
          git fetch upstream --tags --force

      - name: Sync upstream code to sync branch
        run: |
          echo "Upstream: $(git rev-parse upstream/master)"
          git branch -f sync upstream/master
          git push origin sync --force
          git push origin --tags --force
